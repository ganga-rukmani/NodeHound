version: "3.8"

services:
  neo4j:
    image: neo4j:5.24-community
    container_name: NodeHond
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt protocol (used by Python driver)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nodehound123}
      - NEO4J_PLUGINS=["graph-data-science"]   # needed for Louvain / PageRank
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-nodehound123} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  neo4j_data:
    name: nodehound_neo4j_data
  neo4j_logs:
    name: nodehound_neo4j_logs