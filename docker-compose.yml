version: "3.8"

services:
  neo4j:
    image: neo4j:5.24-community
    container_name: nodehound-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt protocol (used by Python driver)
    environment:
      - NEO4J_AUTH=neo4j/nodehound123   # username/password — change if you like
      - NEO4J_PLUGINS=["graph-data-science"]   # needed later for Louvain/PageRank
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs: